# 曲の演奏特性(選曲ノートのスコアリング・バッジ表示用)
# [代理コミットの検証] この行はすぐ削除します
# tempo: up(アップ) | mid(ミドル) | slow(スロー)   ※Claudeによる暫定値。要レビュー
# ballad: バラードかどうか                        ※同上
# bpm: 数字(表示は BPM=xxx)  ※MusicBrainz+AcousticBrainzの解析値を自動取得したもの。
#      倍/半分で入っていることがあるので、おかしい値は選曲ノートから直してください。
#      取得しなおすには node scripts/fetch-bpm.mjs
# kouhaku: true = 紅白歌合戦で歌唱                 ※Wikipedia「aiko」出演履歴で確認済み
# tieup: 'タイアップの内容'                        ※Wikipedia「aiko」タイアップ一覧で確認済み
# シングル/カップリングのバッジは album_tracks から自動導出されます。
# 季節タグは data/song_seasons.yml (aiko公式Spotifyプレイリスト由来) です。

